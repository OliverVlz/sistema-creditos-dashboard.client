version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_APP_NAME=${VITE_APP_NAME:-Sistema de Créditos}
    container_name: presta-ya-frontend
    ports:
      - "5173:80"
    environment:
      # URL del backend
      # Desarrollo local: http://host.docker.internal:3000 (Docker Desktop)
      # Desarrollo Linux/WSL2: http://172.17.0.1:3000 o IP del host
      # Producción VPS: https://api.tudominio.com o http://IP_DEL_VPS:3000
      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

